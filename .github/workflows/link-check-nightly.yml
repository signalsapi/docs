name: Nightly external link check

# AD-10: external links never gate a pull request. rake check runs
# html-proofer with --disable-external, so a third party's outage can't
# redden an unrelated PR. This workflow sweeps the full external set on a
# schedule instead and files or updates one tracking issue.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  external-links:
    runs-on: ubuntu-latest
    permissions:
      issues: write # required for peter-evans/create-issue-from-file
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 0

      - name: Build the site
        run: bundle exec rake check:build

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Two flags carry the AD-10 contract, and both are load-bearing.
          #
          # --root-dir: a root-relative href in a local file has no base to
          # resolve against, so lychee reports every one as an error. On this
          # site that was 4194 errors a night, which overflowed the 65536-char
          # issue body and buried the two genuine 404s below the truncation.
          #
          # --scheme: internal links are html-proofer's job in `rake check`.
          # Checking them here too would only re-prove what already gates every
          # PR. Scheme alone cannot replace --root-dir -- resolution happens
          # before the scheme filter, so the errors are raised either way.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/_site
            --scheme http
            --scheme https
            './_site/**/*.html'
          fail: false

      # Without an issue-number, create-issue-from-file opens a fresh issue on
      # every run -- three identical ones piled up before this lookup existed.
      # An empty output is falsy to the action, which then files the first one.
      - name: Find the open tracking issue
        id: tracking
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --label link-rot --limit 1 --json number --jq '.[0].number // ""')"
          echo "number=${number}" >> "${GITHUB_OUTPUT}"

      - name: File or update the tracking issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          issue-number: ${{ steps.tracking.outputs.number }}
          title: Nightly external link check found broken links
          content-filepath: ./lychee/out.md
          labels: link-rot, automated
