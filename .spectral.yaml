extends: spectral:oas

# No rule overrides.
#
# duplicated-entry-in-enum was turned off here until 2026-08-03, not because
# the rule was wrong but because it aborted the whole run: its JSONPath
# dereferenced `@.enum` before testing `@` for null, so nimma's compiled
# traversal threw "Cannot read properties of null (reading 'enum')" on the
# `plan: null` the whoami example carries. That null is load-bearing —
# fixtures/v1/whoami.json records it and mock-examples-match-fixtures requires
# the example and the fixture to agree by value.
#
# @stoplight/spectral-rulesets 1.22.7 added the missing `@ != null` guard, so
# the rule now traverses past the null and runs clean. The fix arrived in a
# transitive dependency, not the CLI — 6.16.2 is unchanged either side of it —
# which is why .spectral-ruleset-version pins the ruleset alongside
# .spectral-version, and why spectral-ruleset-pinned asserts CI installs both.
