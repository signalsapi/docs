<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2300e87b'/><circle cx='16' cy='16' r='5' fill='%230a0a0b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400;1,9..40,500&display=swap" rel="stylesheet">

{%- if page.page_type == "faq" -%}
{%- capture newline %}
{% endcapture -%}
{%- assign h2_delimiter = newline | append: "## " -%}
{%- assign faq_sections = page.content | split: h2_delimiter -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
{%- for section in faq_sections -%}
  {%- unless forloop.first -%}
    {%- assign question_raw = section | split: newline | first -%}
    {%- assign answer_raw = section | remove_first: question_raw -%}
    {%- assign question = question_raw | markdownify | strip_html | replace: "&gt;", ">" | replace: "&lt;", "<" | replace: "&amp;", "&" | strip -%}
    {%- assign answer = answer_raw | markdownify | strip_html | replace: newline, " " | replace: "&gt;", ">" | replace: "&lt;", "<" | replace: "&amp;", "&" | strip -%}
    {
      "@type": "Question",
      "name": {{ question | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ answer | jsonify }}
      }
    }{% unless forloop.last %},{% endunless %}
  {%- endunless -%}
{%- endfor %}
  ]
}
</script>
{%- endif -%}
