meta:
  owner: mykola
  verified_on: 2026-08-03
  source: the canonical self-serve ladder and the managed-service figures published on faq.md (commit 2768259, 2026-07-31, closing signalsapi-4208 and signalsapi-4210); everything still unconfirmed is an owner-marked placeholder citing where its last known value came from, not a claim that value still holds today.

items:
  - name: free_tier_description
    kind: free_tier
    value: No connected people-data provider key — company signals only, no people data, no SignalsAPI credits spent on lookups.
    source: features/bring-your-own-people-provider.md

  - name: self_serve_ladder_summary
    kind: ladder
    value: "You pay for qualifying signals, not for companies monitored: €79/month for 50 signals, €199 for 250, €399 for 1,000, custom above 5,000."
    source: faq.md (canonical answer-engine pull quote, 2026-07-31)

  - name: qualifying_signal_definition
    kind: definition
    value: one verified hiring event at one company that passes your filters. Several roles posted by the same company in the same window count once; agency reposts, duplicates and unverified postings never count, and false positives are credited back.
    source: faq.md (2026-07-31)

  - name: self_serve_evaluation_tier
    kind: free_tier
    value: There is a free evaluation tier, and enrichment runs on your own provider key at that provider's cost.
    source: faq.md (2026-07-31)

  - name: self_serve_plan_starter
    kind: plan_tier
    label: Starter
    value: "€79"
    included: "50"
    per_additional: "€1.58"
    source: faq.md (2026-07-31)

  - name: self_serve_plan_growth
    kind: plan_tier
    label: Growth
    value: "€199"
    included: "250"
    per_additional: "€0.80"
    source: faq.md (2026-07-31)

  - name: self_serve_plan_pro
