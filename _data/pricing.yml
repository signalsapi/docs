  - name: managed_service_monthly
    kind: managed
    value: "£400/€490/$550"
    source: faq.md (2026-07-31)

  - name: managed_phone_packages
    kind: managed
    value: "£49/month for 100 telephone numbers, £149 for 300 and £199 for 500"
    source: faq.md (2026-07-31)

  # The 2024-03-08 changelog entry's separate "free user gets a total of 150
  # credits" allowance has no counterpart in the billing system: there is one
  # automatic grant, and it is the trial's. Folded into trial_allowance rather
  # than left standing as a figure nothing implements (signalsapi-4279).
  - name: trial_allowance
    kind: allowance
    value: 20 credits, granted once when you verify your email address, and 7 days of access from that moment. There is no separate free-tier credit allowance on top of it.
    source: the billing system — s2 `app/app_di_container.py` (trial_duration_days 7, trial_credits 20) feeding `services/app_user_service.py` UserTrialService.start_trial, confirmed on 2026-08-03 against the production credits ledger, whose only automatic grant on record is a 20-credit Trial entry.

  - name: credit_expiry
    kind: expiry
    value: Unspent credits do not expire — a balance carries forward until it is spent. What ends is access to the account, when its term runs out.
    source: the billing system — a balance is an unfiltered sum over the credits ledger (s2 `repositories/user_repository.py`), no code path or scheduled job expires a credit, and the production ledger holds no expiry entry (checked 2026-08-03). The 60-day window announced in the 2025-04-11 changelog entry was never implemented or has since been removed.

  - name: run_frequency
    kind: schedule
    value: Searches are not scheduled per plan. They are topped up continuously in the background, and what bounds a run is your available credit balance, shared evenly across your searches.
    source: the billing system — s2 `processors/board_project_feeder.py` driven by `orchestrators/main_board_project_feeder.py` loops over every active account every few seconds and splits that account's credit balance across its searches; the plans table carries no run-frequency column and holds no rows in production (checked 2026-08-03). Supersedes the 2024-03-20 changelog entry's "run frequency depends on plan".
