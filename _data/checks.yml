---
- id: 404-router-shape
  desc: _site/404.html exists, references the search input, and links to at least
    six internal destinations
  covers:
  - '2.6'
- id: aux-links-not-template
  desc: _config.yml declares real aux_links, not the commented just-the-docs template
    block
  covers:
  - '2.12'
- id: baseline-immutable
  desc: '_data/baseline.yml''s items: don''t change without meta.verified_on changing
    in the same commit'
  covers:
  - '3.3'
- id: baseline-page-renders-all-keys
  desc: Every key in _data/baseline.yml appears in the built /docs-baseline/ page
  covers:
  - '3.2'
- id: baseline-values-sourced
  desc: 'Every value in _data/baseline.yml''s items: is an integer, a date, a boolean,
    or a well-formed TODO(owner: handle): marker'
  covers:
  - '3.1'
- id: canonical-no-double-slash
  desc: No file under _site/ contains docs.signalsapi.com//
  covers:
  - '2.1'
  - FR6
- id: checks-id-matches-filename
  desc: Every script/checks/*.rb file registers an id equal to its own basename
  covers:
  - '1.11'
- id: checks-manifest-current
  desc: _data/checks.yml matches the live Check registry
  covers:
  - '1.8'
- id: checks-one-per-file
  desc: Each script/checks/*.rb file calls Check.register exactly once (AD-3)
  covers:
  - '1.6'
- id: ci-runs-rake-check
  desc: ".github/workflows/ci.yml contains a step whose run command is exactly `bundle
    exec rake check`"
  covers:
  - '1.10'
- id: code-fence-language
  desc: Every fenced code block declares a language
  covers:
  - '5.5'
- id: concept-page-shape
  desc: 'Every page_type: concept page carries the four required concept headings:
    What it is, Why it matters, How it fits the pipeline, and Related'
  covers:
  - '4.7'
- id: config-strict-front-matter
  desc: '_config.yml declares strict_front_matter: true'
  covers:
  - '1.2'
- id: currency-outside-data
  desc: No .md file outside _data/pricing.yml and the pricing page template states
    a bare currency figure
  covers:
  - '2.9'
- id: data-envelope-shape
  desc: '_data/baseline.yml carries exactly a meta: mapping and an items: mapping
    at the top level'
  covers:
  - '3.3'
- id: description-not-site-default
  desc: No page's description equals _config.yml's site-level description
  covers:
  - '5.3'
- id: description-unique
  desc: No two pages declare the same description
  covers:
  - '5.3'
- id: external-links-off-pr-path
  desc: html-proofer runs --disable-external in the Rakefile, and the nightly lychee
    workflow never triggers on pull_request
  covers:
  - '1.13'
- id: focus-visible-ring-present
  desc: 'custom.scss never sets outline: none on a :focus rule without a paired :focus-visible
    rule'
  covers:
  - '2.13'
- id: frontmatter-universal-contract
  desc: Every page carries title, layout, description and page_type, with description
    between 50 and 160 characters
  covers:
  - '5.2'
- id: gemfile-html-proofer-pinned
  desc: Gemfile declares html-proofer with a ~> 5 constraint
  covers:
  - '1.3'
- id: glossary-entry-shape
  desc: Every _data/glossary.yml entry has term, definition and owning_page, and no
    term appears twice
  covers:
  - '4.1'
- id: glossary-page-complete
  desc: The built /concepts/glossary/ page contains every entry present in _data/glossary.yml
  covers:
  - '4.4'
- id: home-is-router
  desc: index.md links to no booking host, carries at least six internal links, and
    stays under the router word budget
  covers:
  - '5.1'
- id: layout-home-is-index-only
  desc: 'index.md is the only page declaring layout: home; every page declares a layout'
  covers:
  - '2.11'
- id: nav-order-integrity
  desc: Every sibling group of pages (by parent) has unique, integer, contiguous nav_order
    values
  covers:
  - '2.10'
- id: no-childless-has-children
  desc: 'Every page declaring has_children: true is named as a parent: by at least
    one other page'
  covers:
  - '5.8'
- id: no-gitbook-mention-artifacts
  desc: No .md file contains a Markdown link whose title attribute is the literal
    string "mention"
  covers:
  - '2.7'
- id: no-live-sandbox-claim
  desc: No page asserts that a public base URL, a hosted sandbox, or an issued key
    exists for the agent data plane
  covers:
  - '5.6'
- id: object-model-single-name
  desc: No .md file outside the glossary page names the lead-list object with anything
    but Project or its declared alias
  covers:
  - '4.2'
- id: one-canonical-per-page
  desc: Every built HTML file contains exactly one rel="canonical" element
  covers:
  - '2.14'
- id: palette-constants
  desc: The hex values in _sass/color_schemes/signalsapi.scss match the fourteen declared
    in DESIGN.md
  covers:
  - '2.15'
- id: palette-contrast-floor
  desc: DESIGN.md's declared text-on-background pairing meets the WCAG 4.5:1 contrast
    floor
  covers:
  - '2.15'
- id: parent-resolves-to-has-children
  desc: 'Every page''s parent: value matches the title of a page declaring has_children:
    true'
  covers:
  - '4.9'
- id: permalink-pretty-set
  desc: '_config.yml declares permalink: pretty'
  covers:
  - '2.3'
- id: phone-pricing-not-in-faq
  desc: faq.md has no currency symbol adjacent to the word 'phone', and 'propsects'
    appears nowhere
  covers:
  - '2.8'
- id: plugin-budget
  desc: '_config.yml''s plugins: list is a subset of {jekyll-sitemap, jekyll-redirect-from,
    jekyll-seo-tag}'
  covers:
  - '2.14'
- id: robots-sitemap-absolute
  desc: '_site/robots.txt exists with an absolute Sitemap: line and no double slash
    after the host'
  covers:
  - '2.5'
- id: root-section-count
  desc: The number of top-level pages (integer nav_order, no parent:) matches the
    constant declared in this file
  covers:
  - '5.9'
- id: router-page-shape
  desc: 'Every page_type: router page has a ''## Where to go'' heading, at least three
    internal links, no image, and fewer than 250 words'
  covers:
  - '4.6'
- id: ruby-version-single-source
  desc: 'Ruby is pinned by .ruby-version only — no inline ruby-version: in CI, no
    `ruby` directive in the Gemfile'
  covers:
  - '1.9'
- id: search-creation-documented
  desc: 'Some page in the built site declares the pipeline''s first stage as its stage:
    value'
  covers:
  - '5.7'
- id: site-excludes-scaffolding
  desc: '_config.yml declares exclude: for repo scaffolding, and none of those entries
    appears under _site/'
  covers:
  - '2.2'
- id: site-model-contract
  desc: site.pages, site.html_files, site.data and site.raw(path) are all present
    and non-nil
  covers:
  - '1.7'
- id: sitemap-covers-published-pages
  desc: 'sitemap.xml lists every page that is not nav_exclude''d and not sitemap:
    false'
  covers:
  - '2.4'
- id: stage-key-valid
  desc: 'Every page''s stage: front-matter value names a stage declared in _data/pipeline.yml'
  covers:
  - '4.8'
- id: task-page-shape
  desc: 'Every page_type: task page carries the four required task headings: Before
    you start, Steps, Check it worked, and If it did not work'
  covers:
  - '5.4'
- id: term-include-keys-resolve
  desc: Every include term.html key="..." invocation names a term that exists in _data/glossary.yml
  covers:
  - '4.3'
- id: title-unique
  desc: No two pages declare the same title
  covers:
  - '5.9'
- id: todo-owner-grammar
  desc: 'Every marker matches the grammar TODO(owner: <handle>): <what is needed>'
  covers:
  - '1.12'
- id: vale-aliases-match-glossary
  desc: The alias set in styles/SignalsAPI/DeprecatedAliases.yml matches the alias
    set in _data/glossary.yml
  covers:
  - '4.5'
- id: vale-config-present
  desc: ".vale.ini exists and its StylesPath resolves to an existing directory"
  covers:
  - '1.4'
- id: vale-styles-nonempty
  desc: styles/SignalsAPI/ contains at least one Vale rule file
  covers:
  - '1.4'
- id: vale-version-pinned
  desc: ".vale-version records a real Vale version, not the literal word 'latest'"
  covers:
  - '1.5'
