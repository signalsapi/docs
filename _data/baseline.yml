# The site's as-is condition on 2026-07-31, the date of the audit this
# overhaul responds to (PROJECT_CONTEXT.md). Every item value from
# published_pages through last_changelog_entry is measured directly from
# git commit ddc51a8 (2026-07-09) — the last real-content commit before
# the overhaul's planning artifacts and Epic 1 harness landed, and
# identical in content to what the 2026-07-31 audit inspected. Those
# items are a historical record: baseline-immutable fails the build if
# any value here changes without meta.verified_on changing in the same
# commit.
#
# hand_written_pages_ceiling (Story 11.12) is the one exception: a live
# page-budget ceiling, not a historical measurement, and it is excluded
# from baseline-immutable's comparison for exactly that reason — it has
# its own dedicated guard instead. page-budget.rb fails outright if the
# page count exceeds this ceiling and the ceiling itself didn't move in
# the same commit (checked directly against git HEAD, independent of
# meta.verified_on), which is what makes adding a page a deliberate act.

meta:
  owner: mykola
  verified_on: 2026-08-03
  source: git commit ddc51a8 (2026-07-09) for every item except hand_written_pages_ceiling, which tracks this repo's own site.pages count (introduced in Story 11.12, raised in each commit that needs the room)

items:
  published_pages: 28
  pages_with_unique_description: 0
  images_with_empty_alt: 62
  sitemap_present: false
  robots_txt_present: false
  pages_with_zero_inbound_links: 16
  last_changelog_entry: 2026-06-18
  hand_written_pages_ceiling: 57
