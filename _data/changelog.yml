meta:
  owner: mykola
  verified_on: 2026-08-03
  source: 'transcribed from whats-new/index.md''s changelog (222 entries as of this repository''s current state) for Story 11.7; feature is the existing page each entry''s bullet is about, judged by keyword match against the entry text where no page was already linked; Story 11.9 backfilled the API access (2026-06-30) and agent data plane (2026-07-09) launches, dated from each page''s own first commit (git log --follow), since neither had a changelog entry documenting its launch; Story 11.10 removed the screenshots: field once those images were retired; Story 11.11 remapped the entry naming is-it-working.md to faq.md once that page was retired'
items:
- date: 2026-07-31
  summary: '**Limadata** joins the bring-your-own people-data providers — title, country, city and skills all filtered at source, LinkedIn profile and headline returned, and mobile phone numbers alongside LeadMagic. One API key.'
  feature: features/bring-your-own-people-provider.md
- date: 2026-07-29
  summary: '**Wiza** joins the bring-your-own people-data providers — title, country, city and skills all filtered at source, plus mobile phone numbers. Email and phone are reveals that bill only on a hit, spent against one-off API credits rather than a seat plan. One API key.'
  feature: features/bring-your-own-people-provider.md
- date: 2026-07-29
  summary: '**HarvestAPI** joins the bring-your-own people-data providers — LinkedIn lead search with title and country filtered at source. It has no email product, so it returns people and job titles only, and a project with "Email is required" on will not spend against it.'
  feature: features/bring-your-own-people-provider.md
- date: 2026-06-30
  summary: 'API access launches: a read-only REST API for pulling your own projects and leads out of SignalsAPI as JSON or CSV.'
  feature: features/api-access.md
- date: 2026-07-09
  summary: 'The agent data plane launches: a machine-facing surface reporting what changed in a company''s hiring activity, not just what''s posted now -- a REST API, an MCP server, and a Clay integration.'
  feature: features/agent-data-plane.md
- date: 2026-07-09
  summary: 'Agent data plane REST API published: the full /v1 reference for every endpoint, request, and response shape.'
  feature: features/agent-data-plane-api.md
- date: 2026-07-09
  summary: 'Agent data plane MCP server published: the same primitives as agent tools -- code-complete, not yet hosted at a public endpoint.'
  feature: features/agent-data-plane-mcp.md
- date: 2026-07-09
  summary: 'Agent data plane Clay integration published: a company''s hiring motion as flat, filterable columns from a single enrichment call.'
  feature: features/agent-data-plane-clay.md
- date: 2026-06-18
  summary: '**Job description required words** -- the "Job description search terms" field is now a hard requirement and has been renamed accordingly. A signal is kept only if its description contains at least one of the words you list (OR within the list), on top of any job-title requirement. This is the description counterpart of "Job title required words". Use case: keep only **remote-friendly** roles by requiring `remote`, `home`, or `hybrid` in the description. Previously these words only widened the search, so jobs that didn''t actually mention them could still slip through. Read more: [Advanced search](/features/advanced-search)'
  feature: features/advanced-search.md
- date: 2026-04-16
  summary: '**Company website always in exports** -- CSV exports now always include the company website and domain, even when no decision-makers were found. Companies from sources that don''t provide website data are automatically enriched in the background via LinkedIn lookup. While enrichment is in progress, the signal detail page shows an "Enriching..." badge on the Website and LinkedIn URL fields. Use case: you see an interesting signal and want to dig into the company before finding the right people.'
  feature: features/find-decision-makers.md
- date: 2026-04-16
  summary: '**"Available on paid plans" on sample pages** -- sample lead pages and CSV downloads now show "available on paid plans" instead of blank fields for decision-maker data (name, title, LinkedIn, email). This encourages trial users to upgrade for full lead details.'
  feature: features/find-decision-makers.md
- date: 2026-04-16
  summary: '**Company name in CSV exports** -- the company name column was missing from CSV downloads; now included.'
  feature: features/api-access.md
- date: 2026-04-16
  summary: '**Accurate signal status badges** -- the Signals page now correctly distinguishes between companies where decision-makers were actually found vs. companies that only passed qualification filters. Previously, all qualified companies showed "Leads found" even when no decision-makers existed. Now:'
  feature: features/find-decision-makers.md
- date: 2026-04-14
  summary: '**Recruit CRM** integration — push qualified leads into your Recruit CRM as **contacts** (sales-side prospects, not candidates), linked to the hiring company. Duplicate contacts are detected by email, so re-exports do not create duplicates. Add it in Settings → Integrations → Recruit CRM (requires a Business-tier Recruit CRM plan or higher, as the Recruit CRM Open API is not available on lower plans).'
  feature: features/integrations.md
- date: 2026-03-17
  summary: '**Semantic search** -- AI-powered search that finds similar job titles beyond exact keyword matching. "Project manager" now also finds "delivery manager", "program director", "PMO lead" and other semantically related roles.'
  feature: features/advanced-search.md
- date: 2026-03-17
  summary: '**Description search** -- search within job descriptions separately from titles. Catches signals where relevant terms appear in the description but not the title.'
  feature: features/advanced-search.md
- date: 2026-03-17
  summary: '**Skills filter** -- require or exclude specific skills mentioned in the job posting (e.g., PMP, PRINCE2, Agile).'
  feature: features/advanced-search.md
- date: 2026-03-17
  summary: '**Job families** -- filter by structured job classification regardless of title wording.'
  feature: features/advanced-search.md
- date: 2026-03-17
  summary: '**Location patterns** -- match specific cities or regions (e.g., "London", "Manchester") instead of filtering by country only.'
  feature: features/advanced-search.md
- date: 2026-03-17
  summary: '**Exclude staffing agencies** -- built-in filter that''s more reliable than manual stop words.'
  feature: features/filter-leads-with-ai.md
- date: 2026-03-17
  summary: '**Hard to fill** -- only show roles open 30+ days or reposted 3+ times.'
  feature: features/advanced-search.md
- date: 2026-03-17
  summary: '**Hiring surge** -- only show companies with 5+ new roles in 30 days at 1.5x rate.'
  feature: features/advanced-search.md
- date: 2026-03-17
  summary: '**Job posting age** now works correctly -- the "Maximum age of job posting" setting is now properly applied.'
  feature: features/advanced-search.md
- date: 2026-03-17
  summary: '**Company stop words** are now applied during search (previously only applied after fetching, wasting credits).'
  feature: features/filter-leads-with-ai.md
- date: 2026-03-17
  summary: '**Automatic retry for failed personations** -- companies that initially returned "no leads found" (e.g., because their LinkedIn profile wasn''t resolved yet) are now automatically re-checked. When enrichment data improves, tasks are reset and decision-maker search runs again — no manual intervention needed.'
  feature: features/find-decision-makers.md
