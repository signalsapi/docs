meta:
  owner: mykola
  verified_on: 2026-08-03
  source: capabilities transcribed from Compare people-data providers and Bring your own people-data provider (Story 7.2); each cost figure is read off that provider's own public pricing page and carries the URL and the date it was read in its item's source. Where a page renders its ladder client-side, the figure comes from the first-party endpoint that page reads, named in the same source — never from a third party's transcription of it. Recheck cadence is the existing data-staleness assertion — bump meta.verified_on when the ladder is re-read, and the build reports this file once it passes 90 days.

