meta:
  owner: mykola
  verified_on: 2026-09-01
  source: 'transcribed directly from the settings-panel screenshots this story deletes
    (features/do-not-contact-list.png, features/find-decision-makers-1.png, features/find-decision-makers-2.png,
    features/remove-duplicate-signals-2.png) before removing them -- see Story 11.3. The two Duplicates rows
    are gone. That screen appeared in the screenshots but not in the product, and the two controls it showed
    ("Within this list", "Among all lists") have no field behind them. They are replaced by the one control
    on this subject that does exist, read off the project form itself rather than off an image.'
items:
  - screen: Edit Do-Not-Contact List
    click_path: Leads -> Do-Not-Contact
    field: Domains
    description: Disqualify companies based on domain, and people based on email domain. One per line.
    example: google.com
    owning_page: features/do-not-contact-list.md
  - screen: Select decision-makers
    click_path: Personas -> create a new persona
    field: Job titles of decision-makers
    description: Look for decision-makers with any of these titles. One per line.
    example: CEO, managing director
    owning_page: features/find-decision-makers.md
  - screen: Select decision-makers
    click_path: Personas -> create a new persona
    field: Person location
    description: Where the decision-maker must be located.
    example: Anywhere (default), Include only selected, Exclude selected
    owning_page: features/find-decision-makers.md
  - screen: Select decision-makers
    click_path: Personas -> create a new persona
    field: Max decision-makers per company
    description: Limit the number of decision-makers identified for each company.
    example: '3'
    owning_page: features/find-decision-makers.md
  - screen: Basic filters
    click_path: Lead Lists -> set up a project -> Basic filters
    field: Signals per company per day
    description: How many hiring signals one company may contribute in a day. Leave empty to take each company once
      and never again.
    example: Empty (default); test-mode projects use 3
    owning_page: features/remove-duplicate-signals.md
